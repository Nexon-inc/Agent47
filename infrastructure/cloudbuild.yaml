steps:
  # ============================
  # BUILD BACKEND IMAGE
  # ============================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/${PROJECT_ID}/agent47-repo/backend:${SHORT_SHA}'
      - '-t'
      - 'us-central1-docker.pkg.dev/${PROJECT_ID}/agent47-repo/backend:latest'
      - 'backend'
    waitFor: ['-']

  # ============================
  # PUSH BACKEND IMAGE (both tags in one step)
  # ============================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/${PROJECT_ID}/agent47-repo/backend'
      - '--all-tags'
    waitFor: ['build-backend']

  # ============================
  # DEPLOY BACKEND
  # ============================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-backend'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'agent47-backend'
      - '--image'
      - 'us-central1-docker.pkg.dev/${PROJECT_ID}/agent47-repo/backend:${SHORT_SHA}'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--service-account'
      - 'agent47-run@${PROJECT_ID}.iam.gserviceaccount.com'

      # Plain environment variables (no secrets here)
      - '--set-env-vars'
      - 'ENVIRONMENT=production,DEBUG=false,PRIMARY_LLM_PROVIDER=groq,BASE_URL=https://agent47-eight.vercel.app'

      # === ALL SECRETS INJECTED VIA --set-secrets (split into safe groups) ===
      - '--set-secrets'
      - 'SUPABASE_URL=supabase-url:latest,SUPABASE_ANON_KEY=supabase-anon-key:latest,SUPABASE_SERVICE_ROLE_KEY=supabase-service-role-key:latest,SUPABASE_DB_URL=supabase-db-url:latest'

      - '--set-secrets'
      - 'JWT_SECRET_KEY=jwt-secret-key:latest,SECURITY_SECRET_KEY=security-secret-key:latest'

      - '--set-secrets'
      - 'GROQ_API_KEY=groq-api-key:latest,OPENAI_API_KEY=openai-api-key:latest,GOOGLE_GEMINI_API_KEY=google-gemini-api-key:latest'

      - '--set-secrets'
      - 'REDIS_HOST=redis-host:latest,REDIS_PORT=redis-port:latest'

      - '--set-secrets'
      - 'KAFKA_BOOTSTRAP_SERVERS=kafka-bootstrap:latest'

      - '--set-secrets'
      - 'CHROMA_HOST=chroma-host:latest,CHROMA_PORT=chroma-port:latest'

      - '--set-secrets'
      - 'BILLING_PAYSTACK_SECRET_KEY=paystack-secret-key:latest,BILLING_PAYSTACK_PUBLIC_KEY=paystack-public-key:latest,BILLING_PAYSTACK_WEBHOOK_SECRET=paystack-webhook-secret:latest'

      - '--set-secrets'
      - 'GOOGLE_CLIENT_ID=google-client-id:latest,GOOGLE_CLIENT_SECRET=google-client-secret:latest,GOOGLE_MAPS_API_KEY=google-maps-api-key:latest'

      - '--set-secrets'
      - 'GMAIL_CLIENT_ID=gmail-client-id:latest,GMAIL_CLIENT_SECRET=gmail-client-secret:latest'

      - '--set-secrets'
      - 'YOUTUBE_CLIENT_ID=youtube-client-id:latest,YOUTUBE_CLIENT_SECRET=youtube-client-secret:latest,YOUTUBE_API_KEY=youtube-api-key:latest'

      - '--set-secrets'
      - 'FACEBOOK_APP_ID=facebook-app-id:latest,FACEBOOK_APP_SECRET=facebook-app-secret:latest'

      - '--set-secrets'
      - 'TWITTER_CLIENT_ID=twitter-client-id:latest,TWITTER_CLIENT_SECRET=twitter-client-secret:latest,TWITTER_API_KEY=twitter-api-key:latest,TWITTER_API_SECRET=twitter-api-secret:latest,TWITTER_BEARER_TOKEN=twitter-bearer-token:latest'

      - '--set-secrets'
      - 'SLACK_CLIENT_ID=slack-client-id:latest,SLACK_CLIENT_SECRET=slack-client-secret:latest,SLACK_BOT_TOKEN=slack-bot-token:latest,SLACK_SIGNING_SECRET=slack-signing-secret:latest'

      - '--set-secrets'
      - 'DISCORD_CLIENT_ID=discord-client-id:latest,DISCORD_CLIENT_SECRET=discord-client-secret:latest,DISCORD_BOT_TOKEN=discord-bot-token:latest'

      - '--set-secrets'
      - 'INSTAGRAM_CLIENT_ID=instagram-client-id:latest,INSTAGRAM_CLIENT_SECRET=instagram-client-secret:latest'

      - '--set-secrets'
      - 'TIKTOK_CLIENT_ID=tiktok-client-id:latest,TIKTOK_CLIENT_SECRET=tiktok-client-secret:latest'

      - '--set-secrets'
      - 'PINTEREST_CLIENT_ID=pinterest-client-id:latest,PINTEREST_CLIENT_SECRET=pinterest-client-secret:latest'

      # Hardware & scaling
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--timeout'
      - '300'
      - '--max-instances'
      - '10'
      - '--min-instances'
      - '0'
      - '--project'
      - '${PROJECT_ID}'

    waitFor: ['push-backend']

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: '86400s'