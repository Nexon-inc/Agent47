steps:
  # ============================
  # BUILD BACKEND IMAGE
  # ============================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/${PROJECT_ID}/agent47-repo/backend:${SHORT_SHA}'
      - '-t'
      - 'us-central1-docker.pkg.dev/${PROJECT_ID}/agent47-repo/backend:latest'
      - 'backend'  # Your build context folder
    waitFor: ['-']

  # ============================
  # PUSH BACKEND IMAGE (SHORT_SHA tag)
  # ============================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend-sha'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/${PROJECT_ID}/agent47-repo/backend:${SHORT_SHA}'
    waitFor: ['build-backend']

  # ============================
  # PUSH BACKEND IMAGE (latest tag)
  # ============================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend-latest'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/${PROJECT_ID}/agent47-repo/backend:latest'
    waitFor: ['build-backend']

  # ============================
  # DEPLOY BACKEND
  # ============================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-backend'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'agent47-backend'
      - '--image'
      - 'us-central1-docker.pkg.dev/${PROJECT_ID}/agent47-repo/backend:${SHORT_SHA}'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--service-account'
      - 'agent47-run@${PROJECT_ID}.iam.gserviceaccount.com'
      - '--set-env-vars'
      - 'ENVIRONMENT=production,DEBUG=false'
      - '--set-secrets'
      - 'SUPABASE_URL=supabase-url:latest,SUPABASE_ANON_KEY=supabase-anon-key:latest,SUPABASE_SERVICE_KEY=supabase-service-key:latest,JWT_SECRET=jwt-secret:latest,GEMINI_API_KEY=gemini-api-key:latest'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--timeout'
      - '300'
      - '--max-instances'
      - '10'
      - '--min-instances'
      - '0'
      - '--project'
      - '${PROJECT_ID}'
    waitFor: ['push-backend-sha', 'push-backend-latest']

# ============================
# OPTIONS
# ============================
options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

# ============================
# TIMEOUT
# ============================
timeout: '86400s'
