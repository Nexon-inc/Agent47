              key: YOUTUBE_CLIENT_ID
              optional: true
        - name: YOUTUBE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: platform-oauth-credentials
              key: YOUTUBE_CLIENT_SECRET
              optional: true
        - name: YOUTUBE_API_KEY
          valueFrom:
            secretKeyRef:
              name: platform-oauth-credentials
              key: YOUTUBE_API_KEY
              optional: true
        
        - name: GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
