        # Authentication
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: agent47-secrets
              key: JWT_SECRET_KEY
        
        # Environment Settings
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: agent47-config
              key: ENVIRONMENT
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: agent47-config
              key: LOG_LEVEL
        - name: BASE_URL
