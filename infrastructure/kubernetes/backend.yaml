        - name: MAILCHIMP_API_KEY
          valueFrom:
            secretKeyRef:
              name: platform-oauth-credentials
              key: MAILCHIMP_API_KEY
              optional: true
        
        # Integration/Tool API Keys (Platform-Level)
        - name: BRANDWATCH_API_KEY
          valueFrom:
            secretKeyRef:
              name: platform-oauth-credentials
              key: BRANDWATCH_API_KEY
              optional: true
        
        - name: SEMRUSH_API_KEY
          valueFrom:
            secretKeyRef:
