apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent47-backend
  namespace: agent47
  labels:
    app: agent47-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: agent47-backend
  template:
    metadata:
      labels:
        app: agent47-backend
    spec:
      containers:
      - name: backend
        image: agent47-backend:latest
        ports:
        - containerPort: 8000
        env:
        # Supabase Configuration (Database, Auth, Storage)
        - name: SUPABASE_URL
          valueFrom:
            configMapKeyRef:
              name: supabase-config
              key: SUPABASE_URL
        - name: SUPABASE_ANON_KEY
          valueFrom:
            secretKeyRef:
              name: supabase-credentials
              key: supabase_anon_key
        - name: SUPABASE_SERVICE_ROLE_KEY
          valueFrom:
            secretKeyRef:
              name: supabase-credentials
              key: supabase_service_role_key
        - name: SUPABASE_DB_URL
          valueFrom:
            secretKeyRef:
              name: supabase-credentials
              key: supabase_db_url
        - name: SUPABASE_STORAGE_BUCKET
          valueFrom:
            configMapKeyRef:
              name: supabase-config
              key: SUPABASE_STORAGE_BUCKET
        - name: SUPABASE_STORAGE_URL
          valueFrom:
            configMapKeyRef:
              name: supabase-config
              key: SUPABASE_STORAGE_URL
        - name: SUPABASE_REALTIME_URL
          valueFrom:
            configMapKeyRef:
              name: supabase-config
              key: SUPABASE_REALTIME_URL
        - name: SUPABASE_AUTH_URL
          valueFrom:
            configMapKeyRef:
              name: supabase-config
              key: SUPABASE_AUTH_URL
        
        # Redis Configuration
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: agent47-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: agent47-config
              key: REDIS_PORT
        
        # Kafka Configuration
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: agent47-config
              key: KAFKA_BOOTSTRAP_SERVERS
        
        # ChromaDB Configuration
        - name: CHROMA_HOST
          valueFrom:
            configMapKeyRef:
              name: agent47-config
              key: CHROMA_HOST
        - name: CHROMA_PORT
          valueFrom:
            configMapKeyRef:
              name: agent47-config
              key: CHROMA_PORT
        
        # Groq API Configuration (Primary LLM/TTS/STT)
        - name: GROQ_API_KEY
          valueFrom:
            secretKeyRef:
              name: agent47-secrets
              key: GROQ_API_KEY
        - name: GROQ_API_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: agent47-config
              key: GROQ_API_BASE_URL
        - name: GROQ_DEFAULT_MODEL
          valueFrom:
            configMapKeyRef:
              name: agent47-config
              key: GROQ_DEFAULT_MODEL
        - name: GROQ_MAX_TOKENS
          valueFrom:
            configMapKeyRef:
              name: agent47-config
              key: GROQ_MAX_TOKENS
        - name: GROQ_TEMPERATURE
          valueFrom:
            configMapKeyRef:
              name: agent47-config
              key: GROQ_TEMPERATURE
        - name: PRIMARY_LLM_PROVIDER
          valueFrom:
            configMapKeyRef:
              name: agent47-config
              key: PRIMARY_LLM_PROVIDER
        
        # Optional: OpenAI fallback (if needed)
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: agent47-secrets
              key: OPENAI_API_KEY
              optional: true
        
        # Platform OAuth Credentials (for users to connect their accounts)
        # These are YOUR app credentials from each platform
        - name: LINKEDIN_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: platform-oauth-credentials
              key: LINKEDIN_CLIENT_ID
              optional: true
        - name: LINKEDIN_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: platform-oauth-credentials
              key: LINKEDIN_CLIENT_SECRET
              optional: true
        
        - name: FACEBOOK_APP_ID
          valueFrom:
            secretKeyRef:
              name: platform-oauth-credentials
              key: FACEBOOK_APP_ID
              optional: true
        - name: FACEBOOK_APP_SECRET
          valueFrom:
            secretKeyRef:
              name: platform-oauth-credentials
              key: FACEBOOK_APP_SECRET
              optional: true
        
        - name: TWITTER_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: platform-oauth-credentials
              key: TWITTER_CLIENT_ID
              optional: true
        - name: TWITTER_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: platform-oauth-credentials
              key: TWITTER_CLIENT_SECRET
              optional: true
        - name: TWITTER_API_KEY
          valueFrom:
            secretKeyRef:
              name: platform-oauth-credentials
              key: TWITTER_API_KEY
              optional: true
        - name: TWITTER_API_SECRET
          valueFrom:
            secretKeyRef:
              name: platform-oauth-credentials
              key: TWITTER_API_SECRET
              optional: true
        
        - name: INSTAGRAM_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: platform-oauth-credentials
              key: INSTAGRAM_CLIENT_ID
              optional: true
        - name: INSTAGRAM_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: platform-oauth-credentials
              key: INSTAGRAM_CLIENT_SECRET
              optional: true
        
        - name: TIKTOK_CLIENT_ID
