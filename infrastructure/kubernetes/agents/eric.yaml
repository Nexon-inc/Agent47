apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent47-eric
  namespace: agent47
  labels:
    app: agent47-eric
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agent47-eric
  template:
    metadata:
      labels:
        app: agent47-eric
    spec:
      containers:
      - name: eric
        image: agent47-eric:latest
        ports:
        - containerPort: 8003
        env:
        - name: AGENT_NAME
          value: "eric"
        - name: AGENT_PORT
          valueFrom:
            configMapKeyRef:
              name: agent47-config
              key: ERIC_PORT
        - name: DB_POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: agent47-config
              key: DB_POSTGRES_HOST
        - name: DB_POSTGRES_PORT
          valueFrom:
            configMapKeyRef:
              name: agent47-config
              key: DB_POSTGRES_PORT
        - name: DB_POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: agent47-config
              key: DB_POSTGRES_USER
        - name: DB_POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: agent47-config
              key: DB_POSTGRES_DB
        - name: DB_POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: agent47-secrets
              key: DB_POSTGRES_PASSWORD
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: agent47-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: agent47-config
              key: REDIS_PORT
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: agent47-config
              key: KAFKA_BOOTSTRAP_SERVERS
        - name: CHUTES_API_KEY
          valueFrom:
            secretKeyRef:
              name: agent47-secrets
              key: CHUTES_API_KEY
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: agent47-secrets
              key: OPENAI_API_KEY
        - name: SALESFORCE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: agent47-secrets
              key: SALESFORCE_CLIENT_ID
        - name: SALESFORCE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: agent47-secrets
              key: SALESFORCE_CLIENT_SECRET
        - name: HUBSPOT_API_KEY
          valueFrom:
            secretKeyRef:
              name: agent47-secrets
              key: HUBSPOT_API_KEY
        - name: PIPEDRIVE_API_KEY
          valueFrom:
            secretKeyRef:
              name: agent47-secrets
              key: PIPEDRIVE_API_KEY
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8003
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8003
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: agent47-eric
  namespace: agent47
  labels:
    app: agent47-eric
spec:
  ports:
  - port: 8003
    targetPort: 8003
    protocol: TCP
  selector:
    app: agent47-eric
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agent47-eric-hpa
  namespace: agent47
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agent47-eric
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
