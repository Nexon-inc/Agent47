# Platform OAuth Client Credentials
# These are YOUR app credentials from each platform (Facebook, Twitter, LinkedIn, etc.)
# Users will connect THEIR accounts using these credentials
# After OAuth flow, user tokens are stored in the database (platform_credentials table)

apiVersion: v1
kind: Secret
metadata:
  name: platform-oauth-credentials
  namespace: agent47
type: Opaque
stringData:
  # LinkedIn OAuth Credentials
  # Get from: https://www.linkedin.com/developers/apps
  LINKEDIN_CLIENT_ID: "your_linkedin_client_id_here"
  LINKEDIN_CLIENT_SECRET: "your_linkedin_client_secret_here"
  
  # Facebook OAuth Credentials
  # Get from: https://developers.facebook.com/apps/
  FACEBOOK_APP_ID: "your_facebook_app_id_here"
  FACEBOOK_APP_SECRET: "your_facebook_app_secret_here"
  
  # Twitter OAuth Credentials
  # Get from: https://developer.twitter.com/en/portal/dashboard
  TWITTER_CLIENT_ID: "your_twitter_client_id_here"
  TWITTER_CLIENT_SECRET: "your_twitter_client_secret_here"
  TWITTER_API_KEY: "your_twitter_api_key_here"
  TWITTER_API_SECRET: "your_twitter_api_secret_here"
  TWITTER_ACCESS_TOKEN: "your_twitter_access_token_here"
  TWITTER_ACCESS_TOKEN_SECRET: "your_twitter_access_token_secret_here"
  TWITTER_BEARER_TOKEN: "your_twitter_bearer_token_here"
  
  # Instagram OAuth Credentials
  # Get from: https://developers.facebook.com/apps/ (Instagram Basic Display)
  INSTAGRAM_CLIENT_ID: "your_instagram_client_id_here"
  INSTAGRAM_CLIENT_SECRET: "your_instagram_client_secret_here"
  
  # TikTok OAuth Credentials
  # Get from: https://developers.tiktok.com/
  TIKTOK_CLIENT_ID: "your_tiktok_client_id_here"
  TIKTOK_CLIENT_SECRET: "your_tiktok_client_secret_here"
  
  # Pinterest OAuth Credentials
  # Get from: https://developers.pinterest.com/apps/
  PINTEREST_CLIENT_ID: "your_pinterest_client_id_here"
  PINTEREST_CLIENT_SECRET: "your_pinterest_client_secret_here"
  
  # YouTube OAuth Credentials
  # Get from: https://console.cloud.google.com/apis/credentials
  YOUTUBE_CLIENT_ID: "your_youtube_client_id_here"
  YOUTUBE_CLIENT_SECRET: "your_youtube_client_secret_here"
  YOUTUBE_API_KEY: "your_youtube_api_key_here"
  
  # Google OAuth (for Calendar, Gmail, etc.)
  # Get from: https://console.cloud.google.com/apis/credentials
  GOOGLE_CLIENT_ID: "your_google_client_id_here"
  GOOGLE_CLIENT_SECRET: "your_google_client_secret_here"
  
  # Slack OAuth Credentials
  # Get from: https://api.slack.com/apps
  SLACK_CLIENT_ID: "your_slack_client_id_here"
  SLACK_CLIENT_SECRET: "your_slack_client_secret_here"
  SLACK_BOT_TOKEN: "your_slack_bot_token_here"
  SLACK_SIGNING_SECRET: "your_slack_signing_secret_here"
  
  # Discord OAuth Credentials
  # Get from: https://discord.com/developers/applications
  DISCORD_CLIENT_ID: "your_discord_client_id_here"
  DISCORD_CLIENT_SECRET: "your_discord_client_secret_here"
  DISCORD_BOT_TOKEN: "your_discord_bot_token_here"
  
  # HubSpot OAuth Credentials
  # Get from: https://app.hubspot.com/private-apps
  HUBSPOT_CLIENT_ID: "your_hubspot_client_id_here"
  HUBSPOT_CLIENT_SECRET: "your_hubspot_client_secret_here"
  HUBSPOT_API_KEY: "your_hubspot_api_key_here"
  
  # Salesforce OAuth Credentials
  # Get from: https://developer.salesforce.com/
  SALESFORCE_CLIENT_ID: "your_salesforce_client_id_here"
  SALESFORCE_CLIENT_SECRET: "your_salesforce_client_secret_here"
  SALESFORCE_USERNAME: "your_salesforce_username_here"
  SALESFORCE_PASSWORD: "your_salesforce_password_here"
  SALESFORCE_SECURITY_TOKEN: "your_salesforce_security_token_here"
  
  # Mailchimp OAuth Credentials
  # Get from: https://mailchimp.com/developers/
  MAILCHIMP_CLIENT_ID: "your_mailchimp_client_id_here"
  MAILCHIMP_CLIENT_SECRET: "your_mailchimp_client_secret_here"
  MAILCHIMP_API_KEY: "your_mailchimp_api_key_here"
  
  # SendGrid API Key
  # Get from: https://app.sendgrid.com/settings/api_keys
  SENDGRID_API_KEY: "your_sendgrid_api_key_here"
  
  # Buffer OAuth Credentials
  # Get from: https://buffer.com/developers/apps/create
  BUFFER_CLIENT_ID: "your_buffer_client_id_here"
  BUFFER_CLIENT_SECRET: "your_buffer_client_secret_here"
  BUFFER_ACCESS_TOKEN: "your_buffer_access_token_here"
  
  # Shopify OAuth Credentials
  # Get from: https://partners.shopify.com/
  SHOPIFY_CLIENT_ID: "your_shopify_client_id_here"
  SHOPIFY_CLIENT_SECRET: "your_shopify_client_secret_here"
  SHOPIFY_API_KEY: "your_shopify_api_key_here"
  SHOPIFY_API_SECRET: "your_shopify_api_secret_here"
  SHOPIFY_ACCESS_TOKEN: "your_shopify_access_token_here"
  SHOPIFY_SHOP_DOMAIN: "your_shopify_shop_domain_here"
  
  # Integration/Tool API Keys (Platform-Level)
  # These are YOUR API keys for tools/integrations
  
  # Brandwatch API Key
  # Get from: https://www.brandwatch.com/
  BRANDWATCH_API_KEY: "your_brandwatch_api_key_here"
  
  # Semrush API Key
  # Get from: https://www.semrush.com/api/
  SEMRUSH_API_KEY: "your_semrush_api_key_here"
  
  # Canva API Key
  # Get from: https://www.canva.com/developers/
  CANVA_API_KEY: "your_canva_api_key_here"
  
  # Gmail API Credentials (for platform emails)
  # Get from: https://console.cloud.google.com/apis/credentials
  GMAIL_CLIENT_ID: "your_gmail_client_id_here"
  GMAIL_CLIENT_SECRET: "your_gmail_client_secret_here"
  GMAIL_REFRESH_TOKEN: "your_gmail_refresh_token_here"
  GMAIL_ACCESS_TOKEN: "your_gmail_access_token_here"
  
  # Twilio Credentials (for phone/SMS features)
  # Get from: https://www.twilio.com/console
  TWILIO_ACCOUNT_SID: "your_twilio_account_sid_here"
  TWILIO_AUTH_TOKEN: "your_twilio_auth_token_here"
  TWILIO_PHONE_NUMBER: "your_twilio_phone_number_here"
  
  # Google Maps API Key (for location features)
  # Get from: https://console.cloud.google.com/apis/credentials
  GOOGLE_MAPS_API_KEY: "your_google_maps_api_key_here"
  
  # Note: These are PLATFORM-LEVEL credentials (one set for your entire platform)
  # User-specific tokens are stored in the database after OAuth flow completes
  # 
  # IMPORTANT: The backend uses Pydantic Settings which reads from environment variables
  # Kubernetes injects these as env vars, so NO .env file is needed!
  # Each Settings class has env_prefix (e.g., LINKEDIN_, FACEBOOK_) that matches these keys

