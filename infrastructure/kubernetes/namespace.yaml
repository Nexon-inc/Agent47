apiVersion: v1
kind: Namespace
metadata:
  name: agent47
  labels:
    name: agent47
    app: agent47-platform
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: agent47-quota
  namespace: agent47
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    persistentvolumeclaims: "10"
    services: "20"
    secrets: "20"
    configmaps: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: agent47-limits
  namespace: agent47
spec:
  limits:
  - default:
      cpu: "1"
      memory: "2Gi"
    defaultRequest:
      cpu: "100m"
      memory: "256Mi"
    type: Container
