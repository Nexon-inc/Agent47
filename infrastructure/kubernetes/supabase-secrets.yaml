# Supabase Secrets for Kubernetes
# This file contains the Kubernetes secrets for Supabase integration

apiVersion: v1
kind: Secret
metadata:
  name: supabase-credentials
  namespace: agent47
type: Opaque
data:
  # Base64 encoded values - replace with your actual values
  # To encode: echo -n "your-value" | base64
  supabase_api_url: aHR0cHM6Ly95b3VyLXByb2plY3QtaWQuc3VwYWJhc2UuY28=  # https://your-project-id.supabase.co
  supabase_anon_key: eW91ci1zdXBhYmFzZS1hbm9uLWtleQ==  # your-supabase-anon-key
  supabase_service_role_key: eW91ci1zdXBhYmFzZS1zZXJ2aWNlLXJvbGUta2V5  # your-supabase-service-role-key
  supabase_db_url: cG9zdGdyZXNxbDovL3Bvc3RncmVzOnlvdXItcGFzc3dvcmRAZGIueW91ci1wcm9qZWN0LWlkLnN1cGFiYXNlLmNvOjU0MzIvcG9zdGdyZXM=  # postgresql://postgres:your-password@db.your-project-id.supabase.co:5432/postgres

---
# Environment variables for pods
apiVersion: v1
kind: ConfigMap
metadata:
  name: supabase-config
  namespace: agent47
data:
  # Supabase Configuration
  SUPABASE_URL: "https://your-project-id.supabase.co"
  SUPABASE_ANON_KEY: "your-supabase-anon-key"
  SUPABASE_SERVICE_ROLE_KEY: "your-supabase-service-role-key"
  SUPABASE_DB_URL: "postgresql://postgres:your-password@db.your-project-id.supabase.co:5432/postgres"
  
  # Storage Configuration
  SUPABASE_STORAGE_BUCKET: "agent47-uploads"
  SUPABASE_STORAGE_URL: "https://your-project-id.supabase.co/storage/v1"
  
  # Realtime Configuration
  SUPABASE_REALTIME_URL: "wss://your-project-id.supabase.co/realtime/v1"
  
  # Auth Configuration
  SUPABASE_AUTH_URL: "https://your-project-id.supabase.co/auth/v1"
