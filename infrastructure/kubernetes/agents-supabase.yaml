# Agent Deployments with Supabase Integration
# This file contains the updated agent deployments for Supabase

# Aria Agent
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aria-agent
  namespace: agent47
  labels:
    app: aria-agent
    version: v1
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0  # Zero-downtime: always have at least 2 pods running
  selector:
    matchLabels:
      app: aria-agent
  template:
    metadata:
      labels:
        app: aria-agent
        version: v1
    spec:
      containers:
      - name: aria-agent
        image: agent47/aria-agent:latest
        ports:
        - containerPort: 8001
        env:
        # Supabase Configuration
        - name: SUPABASE_URL
          valueFrom:
            configMapKeyRef:
              name: supabase-config
              key: SUPABASE_URL
        - name: SUPABASE_ANON_KEY
          valueFrom:
            secretKeyRef:
              name: supabase-credentials
              key: supabase_anon_key
        - name: SUPABASE_SERVICE_ROLE_KEY
          valueFrom:
            secretKeyRef:
              name: supabase-credentials
              key: supabase_service_role_key
        - name: SUPABASE_STORAGE_BUCKET
          valueFrom:
            configMapKeyRef:
              name: supabase-config
              key: SUPABASE_STORAGE_BUCKET
        
        # Agent Configuration
        - name: AGENT_NAME
          value: "aria"
        - name: AGENT_PORT
          value: "8001"
        - name: BACKEND_URL
          value: "http://backend:8000"
        
        # AI Services
        - name: CHUTES_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-keys
              key: chutes-api-key
        - name: GROK_API_URL
          value: "http://grok-llm:8001"
        
        resources:
          requests:
            memory: "256Mi"
            cpu: "125m"
          limits:
            memory: "512Mi"
            cpu: "250m"
        
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 10
        
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: aria-agent
  namespace: agent47
  labels:
    app: aria-agent
spec:
  selector:
    app: aria-agent
  ports:
  - name: http
    port: 8001
    targetPort: 8001
  type: ClusterIP

