services:
  - type: web
    name: agent47-backend
    runtime: docker
    region: frankfurt
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health  # Change if your app has a different health endpoint; optional
    maxShutdownDelaySeconds: 60
    numInstances: 1  # Fixed for free; for paid, use scaling below
    # scaling:  # Uncomment for paid plans to match your max 10 instances
    #   minInstances: 1
    #   maxInstances: 10
    #   targetCPUPercent: 60  # Adjust based on load
    #   targetMemoryPercent: 60
    envVars:
      # Plain env vars
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: PRIMARY_LLM_PROVIDER
        value: groq
      - key: BASE_URL
        value: https://agent47-eight.vercel.app
      # Secrets (enter values in Render dashboard when prompted)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_AUTH_URL
        sync: false
      - key: SUPABASE_REALTIME_URL
        sync: false
      - key: SUPABASE_STORAGE_URL
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
      - key: SECURITY_SECRET_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_GEMINI_API_KEY
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: KAFKA_BOOTSTRAP_SERVERS
        sync: false
      - key: CHROMA_HOST
        sync: false
      - key: CHROMA_PORT
        sync: false
      - key: BILLING_PAYSTACK_SECRET_KEY
        sync: false
      - key: BILLING_PAYSTACK_PUBLIC_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_CLIENT_ID
        sync: false
      - key: YOUTUBE_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
