services:
  # =============================================================================
  # DATABASE SERVICES
  # =============================================================================
  
  # PostgreSQL removed - using Supabase instead
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: agent47-postgres
  #   environment:
  #     POSTGRES_DB: agent47_db
  #     POSTGRES_USER: agent47
  #     POSTGRES_PASSWORD: agent47_password
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #     - ./infrastructure/scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
  #   networks:
  #     - agent47-network
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U agent47 -d agent47_db"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  redis:
    image: redis:7-alpine
    container_name: agent47-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - agent47-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "com.docker.compose.service=redis"
      - "description=Redis cache service (no web UI - use redis-cli)"

  # =============================================================================
  # MESSAGE BROKER
  # =============================================================================
  
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: agent47-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - agent47-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "nc -z localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "com.docker.compose.service=zookeeper"
      - "description=Zookeeper coordination service (no web UI)"

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: agent47-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - agent47-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      - "com.docker.compose.service=kafka"
      - "description=Kafka message broker (no web UI - use kafka CLI tools)"

  # =============================================================================
  # VECTOR DATABASE
  # =============================================================================
  
  chromadb:
    image: chromadb/chroma:latest
    container_name: agent47-chromadb
    ports:
      - "8009:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      CHROMA_SERVER_HOST: 0.0.0.0
      CHROMA_SERVER_HTTP_PORT: 8000
    networks:
      - agent47-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      - "com.docker.compose.service=chromadb"
      - "description=ChromaDB vector database"
      - "traefik.enable=false"

  # =============================================================================
  # OLLAMA LLM SERVICE (Primary)
  # =============================================================================
  
  ollama:
    image: ollama/ollama:latest
    container_name: agent47-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama/models
    environment:
      OLLAMA_HOST: 0.0.0.0
      OLLAMA_PORT: 11434
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_LOAD_TIMEOUT: 10m
    networks:
      - agent47-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 6G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 60s
      timeout: 30s
      retries: 3

  ollama-llm:
    build:
      context: ./infrastructure/Ollama
      dockerfile: Dockerfile
    container_name: agent47-ollama-llm
    ports:
      - "8008:8008"
    environment:
      OLLAMA_HOST: ollama
      OLLAMA_PORT: 11434
    depends_on:
      - ollama
    networks:
      - agent47-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/health"]
      interval: 60s
      timeout: 30s
      retries: 3

  # =============================================================================
  # BACKEND API
  # =============================================================================
  
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: agent47-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - OLLAMA_API_URL=http://ollama-llm:8008
      # Supabase configuration (set these in .env file)
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_DB_URL=${SUPABASE_DB_URL}
      - SUPABASE_STORAGE_BUCKET=${SUPABASE_STORAGE_BUCKET}
      - SUPABASE_STORAGE_URL=${SUPABASE_STORAGE_URL}
      - SUPABASE_REALTIME_URL=${SUPABASE_REALTIME_URL}
      - SUPABASE_AUTH_URL=${SUPABASE_AUTH_URL}
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      zookeeper:
        condition: service_healthy
    networks:
      - agent47-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # =============================================================================
  # INDIVIDUAL AGENT SERVICES (Sequential Ports)
  # =============================================================================
  
  aria-agent:
    build:
      context: .
      dockerfile: backend/agents/aria/Dockerfile
    container_name: agent47-aria
    ports:
      - "8001:8001"
    environment:
      - AGENT_NAME=aria
      - AGENT_PORT=8001
      - REDIS_HOST=redis
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      # Supabase configuration (set these in .env file)
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_DB_URL=${SUPABASE_DB_URL}
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      zookeeper:
        condition: service_healthy
    networks:
      - agent47-network
    restart: unless-stopped

  clara-agent:
    build:
      context: .
      dockerfile: backend/agents/clara/Dockerfile
    container_name: agent47-clara
    ports:
      - "8002:8002"
    environment:
      - AGENT_NAME=clara
      - AGENT_PORT=8002
      - REDIS_HOST=redis
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      # Supabase configuration (set these in .env file)
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_DB_URL=${SUPABASE_DB_URL}
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      zookeeper:
        condition: service_healthy
    networks:
      - agent47-network
    restart: unless-stopped

  eric-agent:
    build:
      context: .
      dockerfile: backend/agents/eric/Dockerfile
    container_name: agent47-eric
    ports:
      - "8003:8003"
    environment:
      - AGENT_NAME=eric
      - AGENT_PORT=8003
      - REDIS_HOST=redis
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      # Supabase configuration (set these in .env file)
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_DB_URL=${SUPABASE_DB_URL}
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      zookeeper:
        condition: service_healthy
    networks:
      - agent47-network
    restart: unless-stopped

  jackie-agent:
    build:
      context: .
      dockerfile: backend/agents/jackie/Dockerfile
    container_name: agent47-jackie
    ports:
      - "8004:8004"
    environment:
      - AGENT_NAME=jackie
      - AGENT_PORT=8004
      - REDIS_HOST=redis
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      # Supabase configuration (set these in .env file)
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_DB_URL=${SUPABASE_DB_URL}
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      zookeeper:
        condition: service_healthy
    networks:
      - agent47-network
    restart: unless-stopped

  joe-agent:
    build:
      context: .
      dockerfile: backend/agents/joe/Dockerfile
    container_name: agent47-joe
    ports:
      - "8005:8005"
    environment:
      - AGENT_NAME=joe
      - AGENT_PORT=8005
      - REDIS_HOST=redis
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      # Supabase configuration (set these in .env file)
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_DB_URL=${SUPABASE_DB_URL}
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      zookeeper:
        condition: service_healthy
    networks:
      - agent47-network
    restart: unless-stopped

  purity-agent:
    build:
      context: .
      dockerfile: backend/agents/purity/Dockerfile
    container_name: agent47-purity
    ports:
      - "8006:8006"
    environment:
      - AGENT_NAME=purity
      - AGENT_PORT=8006
      - REDIS_HOST=redis
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      # Supabase configuration (set these in .env file)
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_DB_URL=${SUPABASE_DB_URL}
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      zookeeper:
        condition: service_healthy
    networks:
      - agent47-network
    restart: unless-stopped

  shakes-agent:
    build:
      context: .
      dockerfile: backend/agents/shakes/Dockerfile
    container_name: agent47-shakes
    ports:
      - "8007:8007"
    environment:
      - AGENT_NAME=shakes
      - AGENT_PORT=8007
      - REDIS_HOST=redis
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      # Supabase configuration (set these in .env file)
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_DB_URL=${SUPABASE_DB_URL}
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      zookeeper:
        condition: service_healthy
    networks:
      - agent47-network
    restart: unless-stopped

  # =============================================================================
  # FRONTEND
  # =============================================================================
  
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agent47-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - NEXT_PUBLIC_BASE_URL=http://localhost:3000
      - NEXT_PUBLIC_ADMIN_BASE_URL=http://localhost:8000/admin
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - agent47-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 5

  # =============================================================================
  # MONITORING SERVICES
  # =============================================================================
  
  prometheus:
    image: prom/prometheus:latest
    container_name: agent47-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - agent47-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: agent47-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./infrastructure/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - agent47-network
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: agent47-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./infrastructure/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
    networks:
      - agent47-network
    restart: unless-stopped

  # =============================================================================
  # REVERSE PROXY
  # =============================================================================
  
  nginx:
    image: nginx:alpine
    container_name: agent47-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl
    depends_on:
      - frontend
      - backend
    networks:
      - agent47-network
    restart: unless-stopped

# =============================================================================
# VOLUMES
# =============================================================================

volumes:
  # postgres_data:  # Removed - using Supabase instead
  #   driver: local
  redis_data:
    driver: local
  kafka_data:
    driver: local
  chroma_data:
    driver: local
  ollama_models:
    driver: local
  backend_uploads:
    driver: local
  backend_logs:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  alertmanager_data:
    driver: local

# =============================================================================
# NETWORKS
# =============================================================================

networks:
  agent47-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
